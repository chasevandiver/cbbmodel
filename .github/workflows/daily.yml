name: CBB Daily Automation

on:
  # A daily Claude scheduled task refreshes data/ (Barttorvik blocks GitHub's
  # runners) and pushes it; that push runs this job right away. The schedule
  # slots are a fallback: GitHub runs them late, often by hours. The job is
  # idempotent: grading skips graded games, picks keep their pick-time lines.
  push:
    branches: [main]
    paths: ['data/**']
  schedule:
    - cron: '10 11 * * *'   #  6:10 AM ET
    - cron: '10 12 * * *'   #  7:10 AM ET
    - cron: '10 13 * * *'   #  8:10 AM ET
    - cron: '10 14 * * *'   #  9:10 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbb-commits
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Grade yesterday and generate today's picks
        run: python automate.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- picks/ public/latest.json public/results/results.json public/feed/ data/
          git diff --cached --quiet || git commit -m "auto: $(TZ=America/New_York date +'%b %d') picks + results"
          git pull --rebase origin main
          git push
