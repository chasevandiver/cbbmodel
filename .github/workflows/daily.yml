name: CBB Daily Automation

on:
  schedule:
    # GitHub runs scheduled jobs late, often by hours, so several slots are
    # listed. The job is idempotent: grading skips games already graded and
    # picks are simply regenerated with fresher lines.
    - cron: '10 11 * * *'   #  6:10 AM ET
    - cron: '10 12 * * *'   #  7:10 AM ET
    - cron: '10 13 * * *'   #  8:10 AM ET
    - cron: '10 14 * * *'   #  9:10 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbb-commits
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Grade yesterday and generate today's picks
        run: python automate.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- picks/ public/latest.json public/results/results.json
          git diff --cached --quiet || git commit -m "auto: $(TZ=America/New_York date +'%b %d') picks + results"
          git pull --rebase origin main
          git push
