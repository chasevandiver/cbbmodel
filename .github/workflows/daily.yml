name: CBB Daily Automation

on:
  schedule:
    # 12:30 UTC = 7:30 AM ET / 6:30 AM CT. GitHub often starts scheduled runs
    # late, sometimes by hours, so this is set well before the first tips.
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Grade yesterday and generate today's picks
        run: python automate.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- picks/ public/latest.json public/results/results.json
          git diff --cached --quiet || git commit -m "auto: $(TZ=America/New_York date +'%b %d') picks + results"
          git push
