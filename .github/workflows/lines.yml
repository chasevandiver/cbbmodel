name: Closing line snapshots

# Records the current market line on each of today's picks that has not tipped
# yet. The last snapshot before tip-off is the closing line the results tracker
# uses for closing-line value. Each run also grades the games that have gone
# final and prices the next day's slate as a preview (see the steps). GitHub starts scheduled jobs late, so slots are
# spread through the day. Seven snapshots plus up to four picks runs a day is
# ~330 Odds API requests a month, under the free tier's 500.
on:
  schedule:
    - cron: '0 16 * * *'    # 11:00 AM ET
    - cron: '0 18 * * *'    #  1:00 PM ET
    - cron: '0 20 * * *'    #  3:00 PM ET
    - cron: '0 22 * * *'    #  5:00 PM ET
    - cron: '30 23 * * *'   #  6:30 PM ET
    - cron: '0 1 * * *'     #  8:00 PM ET
    - cron: '30 2 * * *'    #  9:30 PM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbb-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      # --early also prices the next unpublished day (normally tomorrow) into
      # picks/early_<date>.json, from the same Odds API response, so it costs no
      # extra request. That file is a preview: the morning run still writes the
      # pick of record. A preview that fails is logged and does not fail the job.
      - name: Snapshot lines and price the next slate early
        run: python cbb_model.py --snapshot-lines --early
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # ESPN only, no Odds API request. A game is graded once, after it is
      # final, so the record moves through the day instead of the next morning.
      - name: Grade finished games
        run: python results_tracker.py --live
      # The slate app reads public/feed/, not picks/. Without this the feed's
      # `closing` block stayed at whatever the morning run wrote, so the app's
      # line was up to a day stale while this job snapshotted seven times.
      - name: Re-export the shared feed
        run: python export_feed.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- picks/ public/latest.json public/feed/ public/results/results.json
          git diff --cached --quiet || git commit -m "auto: closing-line snapshot $(TZ=America/New_York date +'%b %d %H:%M')"
          git pull --rebase --autostash origin main
          git push
